    m.forEach((row,r)=>row.forEach((v,c)=>{ if(v)f[r][c]|=FLAG_A; }));
    if(pieceCount>=nextAnchorAt) nextAnchorAt=pieceCount+THEME.anchorMin+Math.floor(rnd()*THEME.anchorRange);
  } else if(MT.crack&&rnd()<MT.crack){
    const cells=[]; m.forEach((row,r)=>row.forEach((v,c)=>{ if(v)cells.push([r,c]); }));

// Anker- und Riss-Symbole auf Kacheln

// Symbole auf Kacheln: Anker, Riss, Sprengstein, Magnet, Frost, Doppel-Ladung (Brett und Vorschau)
function markOn(g,cx,cy,S,fl){
  g.save(); g.strokeStyle='rgba(0,0,0,.55)'; g.fillStyle='rgba(0,0,0,.55)'; g.lineWidth=Math.max(1.5,S*.07); g.lineCap='round'; g.lineJoin='round';
  if(fl&FLAG_A){
    g.beginPath(); g.arc(cx,cy-S*.24,S*.07,0,Math.PI*2); g.stroke();
    g.beginPath(); g.moveTo(cx,cy-S*.17); g.lineTo(cx,cy+S*.24); g.stroke();
    g.beginPath(); g.moveTo(cx-S*.14,cy-S*.06); g.lineTo(cx+S*.14,cy-S*.06); g.stroke();
    g.beginPath(); g.arc(cx,cy+S*.02,S*.22,Math.PI*.18,Math.PI*.82); g.stroke();
  }
  if(fl&FLAG_C){
    g.beginPath(); g.moveTo(cx-S*.3,cy-S*.3); g.lineTo(cx-S*.05,cy-S*.05); g.lineTo(cx-S*.15,cy+S*.08); g.lineTo(cx+S*.3,cy+S*.3); g.stroke();
  }
  if(fl&FLAG_B){ // Bombe: Kugel mit Zündschnur und Funke
    g.beginPath(); g.arc(cx-S*.03,cy+S*.06,S*.19,0,Math.PI*2); g.fill();
    g.beginPath(); g.moveTo(cx+S*.08,cy-S*.1); g.quadraticCurveTo(cx+S*.2,cy-S*.2,cx+S*.26,cy-S*.3); g.stroke();
    g.fillStyle='#FFD23F'; g.beginPath(); g.arc(cx+S*.27,cy-S*.31,S*.06,0,Math.PI*2); g.fill();
  }
  if(fl&FLAG_M){ // Magnet: U mit zwei Polen
    g.lineWidth=Math.max(2,S*.11); g.beginPath(); g.arc(cx,cy-S*.04,S*.2,Math.PI,0); g.moveTo(cx-S*.2,cy-S*.04); g.lineTo(cx-S*.2,cy+S*.22); g.moveTo(cx+S*.2,cy-S*.04); g.lineTo(cx+S*.2,cy+S*.22); g.stroke();
    g.strokeStyle='#FF5E5B'; g.beginPath(); g.moveTo(cx-S*.2,cy+S*.12); g.lineTo(cx-S*.2,cy+S*.22); g.moveTo(cx+S*.2,cy+S*.12); g.lineTo(cx+S*.2,cy+S*.22); g.stroke();
  }
  if(fl&FLAG_F){ // Frost: Schneeflocke
    g.strokeStyle='rgba(255,255,255,.85)'; g.lineWidth=Math.max(1.5,S*.06);
    for(let k=0;k<3;k++){ const a=k*Math.PI/3; g.beginPath(); g.moveTo(cx-Math.cos(a)*S*.28,cy-Math.sin(a)*S*.28); g.lineTo(cx+Math.cos(a)*S*.28,cy+Math.sin(a)*S*.28); g.stroke(); }
    g.fillStyle='rgba(255,255,255,.9)'; g.beginPath(); g.arc(cx,cy,S*.06,0,Math.PI*2); g.fill();

    g.fillStyle='rgba(0,0,0,.6)'; g.beginPath(); g.moveTo(cx+S*.08,cy-S*.32); g.lineTo(cx-S*.16,cy+S*.04); g.lineTo(cx-S*.01,cy+S*.04); g.lineTo(cx-S*.08,cy+S*.32); g.lineTo(cx+S*.16,cy-S*.04); g.lineTo(cx+S*.01,cy-S*.04); g.closePath(); g.fill();
    g.fillStyle='#FFD23F'; g.beginPath(); g.moveTo(cx+S*.06,cy-S*.27); g.lineTo(cx-S*.11,cy+S*.01); g.lineTo(cx,cy+S*.01); g.lineTo(cx-S*.06,cy+S*.27); g.lineTo(cx+S*.11,cy-S*.01); g.lineTo(cx,cy-S*.01); g.closePath(); g.fill();
  }
  g.restore();
}

    const now=performance.now(); if(!toast.t0){ toast.t0=now; toast.dur=Math.max(500,toast.until-now); }

  snap.forEach((row,yy)=>row.forEach((v,xx)=>{ if(!v)return; const col=COLORS[v]; x.save(); x.shadowColor=col; x.shadowBlur=THEME.fx==='jelly'?12:4; x.fillStyle=col; x.beginPath(); x.roundRect(bx+xx*cs+2,by+yy*cs+2,cs-4,cs-4,THEME.fx==='jelly'?cs*.3:cs*.12); x.fill(); x.restore();
    x.fillStyle='rgba(255,255,255,.35)'; x.fillRect(bx+xx*cs+cs*.2,by+yy*cs+4,cs*.6,cs*.12); }));
  x.fillStyle='#FFD23F'; x.shadowColor='#FFD23F'; x.shadowBlur=30; x.font='bold 110px Bungee,Nunito,sans-serif'; x.fillText(String(score),W/2,by+bs+130); x.shadowBlur=0;
  x.fillStyle='rgba(237,232,220,.8)'; x.font='700 28px Nunito,sans-serif'; x.fillText(`${lines} ${T().rows} · ${tipsUsed} ${lang==='de'?'Kipps':'tips'} · ${quakes} ${lang==='de'?'Beben':'quakes'} · ${THEME.name[lang]}`,W/2,by+bs+180);
  return c;
}
document.getElementById('shareBtn').addEventListener('click',async()=>{
  const d=new Date(), dat=`${String(d.getDate()).padStart(2,'0')}.${String(d.getMonth()+1).padStart(2,'0')}.${d.getFullYear()}`;
  const text=T().shareText({mode:(daily?T().daily+' '+dat:challenge?challenge.name[lang]:N+'×'+N)+' · '+THEME.name[lang],score,lines,tips:tipsUsed,quakes});
  const b=document.getElementById('shareBtn');
  const modeLabel=daily?T().daily+' '+dat:challenge?challenge.name[lang]:N+'×'+N;
  try{
    const card=shareCard(modeLabel); const blob=await new Promise(r=>card.toBlob(r,'image/png')); const file=new File([blob],'kipp.png',{type:'image/png'});
    if(navigator.canShare&&navigator.canShare({files:[file]})){ await navigator.share({text,files:[file]}); }
    else { const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='kipp.png'; a.click(); try{ await navigator.clipboard.writeText(text); }catch(e){} b.textContent=T().copied; setTimeout(()=>b.textContent=T().share,1500); }
  }
  catch(e){ b.textContent=text; }
});
const muteBtn=document.getElementById('muteBtn');
muteBtn.addEventListener('click',()=>{ muted=!muted; muteBtn.setAttribute('aria-pressed',muted); muteBtn.setAttribute('aria-label',muted?T().unmute:T().mute); if(!muted){audio();SFX.rot();} });
document.getElementById('startBtn').addEventListener('click',start);
// Gesten auf dem Brett: Tippen auf den Stein = drehen, daneben = eine Spalte bewegen,
// Doppeltipp = fallen lassen, horizontal ziehen = schieben, Halten neben dem Stein = wiederholen
let lastTap=0, pressTimer=null, drag=null;
function boardCol(e){ const r=cv.getBoundingClientRect(); return {col:Math.floor((e.clientX-r.left)/r.width*N), px:e.clientX, py:e.clientY, cellPx:r.width/N}; }
function sideOf(col){ if(!cur)return 0; const w=cur.m[0].length; return col<cur.x?-1:col>=cur.x+w?1:0; }
cv.addEventListener('pointerdown',e=>{
  if(!alive||busy||!cur)return; e.preventDefault(); audio(); cv.setPointerCapture(e.pointerId);
  const b=boardCol(e), now=performance.now(), side=sideOf(b.col);
  if(side===0&&now-lastTap<300){ lastTap=0; clearInterval(pressTimer); drag=null; drop(); return; }
  lastTap=side===0?now:0;
  drag={x0:b.px,y0:b.py,cellPx:b.cellPx,moved:0,side,acted:false};
  if(side!==0){ move(side); drag.acted=true; pressTimer=setInterval(()=>{ if(drag&&!drag.moved) move(side); },130); }
});
cv.addEventListener('pointermove',e=>{
  if(!drag||!cur||busy)return;
  const dx=e.clientX-drag.x0, dy=e.clientY-drag.y0, cells=Math.trunc(dx/drag.cellPx);
  // Nach unten streichen = fallen lassen (deutlich vertikal, bevor horizontal geschoben wurde)
  if(!drag.moved&&dy>drag.cellPx*1.2&&Math.abs(dy)>Math.abs(dx)*1.5){ clearInterval(pressTimer); drag=null; lastTap=0; drop(); return; }
  if(cells!==drag.moved){ const step=Math.sign(cells-drag.moved); for(let i=0;i<Math.abs(cells-drag.moved);i++) move(step); drag.moved=cells; drag.acted=true; clearInterval(pressTimer); }
});
const endDrag=e=>{
  clearInterval(pressTimer);
  if(drag&&!drag.acted&&drag.side===0&&cur&&!busy) rotate();
  drag=null;
};
cv.addEventListener('pointerup',endDrag); cv.addEventListener('pointercancel',endDrag);
addEventListener('keydown',e=>{
  const k={ArrowLeft:'left',ArrowRight:'right',ArrowUp:'rot',ArrowDown:'soft',' ':'drop',q:'tipL',e:'tipR',Q:'tipL',E:'tipR'}[e.key];
  if(!k)return; e.preventDefault();
  if(paused)return;
  if(!alive){ if(k==='drop'&&(document.getElementById('initials').hidden||hsSaved))start(); return; }
  k==='soft'? step() : actions[k]();
  if(e.key==='t'||e.key==='T') cycleTheme();
});
applyTheme(); grid=empty(); ids=empty(); flags=empty(); draw(); requestAnimationFrame(bgTick);
</script>
